name: Build Isolated v5 TEST MO2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned CommonLib
        shell: bash
        run: |
          mkdir -p lib
          git clone https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng
          git -C lib/commonlibsse-ng checkout dbb86c2523fae0cc70de074f3e2d1a6b657758dc
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
      - name: Configure
        run: xmake f -y -p windows -a x64 -m releasedbg --skyrim_vr=n
      - name: Build DLL
        run: xmake build -y -v
      - name: Package complete MO2 data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Explicit allowlist: old Dedicated files left in the repository
          # cannot accidentally enter the Isolated artifact.
          $ownPaths = @(
            'BladeFireMode.esp',
            'meshes/weapons/lilithglow',
            'meshes/weapons/lilithsharbinger2h',
            'textures/weapons/lilithsharbinger',
            'meshes/actors/character/animations/OpenAnimationReplacer/BladeFireModeIsolated'
          )
          foreach ($relative in $ownPaths) {
            $source = Join-Path 'ModData' $relative
            $destination = Join-Path 'out' $relative
            if (-not (Test-Path -LiteralPath $source)) { throw "Asset Isolated mancante: $relative" }
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Recurse -Force
          }
          Copy-Item dist/* out/ -Recurse -Force
          if (-not (Test-Path out/SKSE/Plugins/BladeFireMode.dll)) { throw 'DLL mancante' }
          $forbidden = @(
            'out/meshes/actors/character/behaviors',
            'out/meshes/actors/character/characters',
            'out/meshes/actors/character/characters female',
            'out/meshes/animationdatasinglefile.txt',
            'out/meshes/animationsetdatasinglefile.txt',
            'out/Nemesis_Engine'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "File condiviso vietato nel pacchetto Isolated: $path" }
          }
          Get-FileHash out/SKSE/Plugins/BladeFireMode.dll | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: BladeFireMode-Isolated-v5-MO2-TEST
          path: out
          if-no-files-found: error
