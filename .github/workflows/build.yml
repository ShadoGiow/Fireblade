name: Build BladeFireMode FIX5
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned CommonLib
        shell: bash
        run: |
          mkdir -p lib
          git clone https://github.com/alandtse/CommonLibSSE-NG.git lib/commonlibsse-ng
          git -C lib/commonlibsse-ng checkout dbb86c2523fae0cc70de074f3e2d1a6b657758dc
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
      - name: Configure
        run: xmake f -y -p windows -a x64 -m releasedbg --skyrim_vr=n
      - name: Build DLL
        run: xmake build -y -v
      - name: Package complete MO2 data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item ModData/* out/ -Recurse -Force
          Copy-Item dist/* out/ -Recurse -Force
          if (-not (Test-Path out/SKSE/Plugins/BladeFireMode.dll)) { throw 'DLL mancante' }
          Get-FileHash out/SKSE/Plugins/BladeFireMode.dll | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: BladeFireMode-FIX5-MO2
          path: out
          if-no-files-found: error
